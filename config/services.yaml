# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    yoowii.print_pricing.version: 'retail-v1'
    yoowii.print_pricing.markup_basis_points: 3500
    yoowii.print_pricing.minimum_margin: 1200
    yoowii.print_pricing.handling_fee: 0
    yoowii.print_quote.ttl: 900

services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Yoowii/Commerce/Domain/'
            - '../src/Yoowii/Pricing/Domain/Exception/'
            - '../src/Yoowii/Pricing/Domain/PricingSnapshot.php'
            - '../src/Yoowii/Pricing/Domain/Flyer/Exception/'
            - '../src/Yoowii/Pricing/Domain/Flyer/FlyerConfiguration.php'
            - '../src/Yoowii/Pricing/Domain/Flyer/FlyerPricingPolicy.php'
            - '../src/Yoowii/Pricing/Domain/Flyer/FlyerQuote.php'
            - '../src/Yoowii/Pricing/Domain/Print/Definition/'
            - '../src/Yoowii/Pricing/Domain/Print/Exception/'
            - '../src/Yoowii/Pricing/Domain/Print/PrintConfiguration.php'
            - '../src/Yoowii/Pricing/Domain/Print/PrintPricingPolicy.php'
            - '../src/Yoowii/Pricing/Domain/Print/PrintQuote.php'
            - '../src/Yoowii/Pricing/Application/Quote/Exception/'
            - '../src/Yoowii/Pricing/Application/Quote/StoredPrintQuote.php'
            - '../src/Yoowii/Sourcing/Application/Import/Exception/'
            - '../src/Yoowii/Sourcing/Application/Import/FlyerPricingMatrixImportResult.php'
            - '../src/Yoowii/Sourcing/Application/Import/PrintPricingMatrixImportResult.php'
            - '../src/Yoowii/Sourcing/Domain/Exception/'
            - '../src/Yoowii/Sourcing/Domain/Model/'
            - '../src/Yoowii/Sourcing/Domain/PricingMatrixStatus.php'
            - '../src/Yoowii/Sourcing/Domain/SupplierCapability.php'
            - '../src/Yoowii/Sourcing/Domain/SupplierIntegrationMode.php'
            - '../src/Yoowii/Sourcing/UI/Http/Admin/Data/'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\Yoowii\Sourcing\UI\Http\Admin\Controller\:
        resource: '../src/Yoowii/Sourcing/UI/Http/Admin/Controller/'
        tags: ['controller.service_arguments']

    App\Yoowii\Pricing\UI\Http\Storefront\Controller\:
        resource: '../src/Yoowii/Pricing/UI/Http/Storefront/Controller/'
        tags: ['controller.service_arguments']

    App\Yoowii\Pricing\Application\RetailPrintPricingPolicyProvider:
        arguments:
            $version: '%yoowii.print_pricing.version%'
            $markupBasisPoints: '%yoowii.print_pricing.markup_basis_points%'
            $minimumMargin: '%yoowii.print_pricing.minimum_margin%'
            $handlingFee: '%yoowii.print_pricing.handling_fee%'

    App\Yoowii\Pricing\Infrastructure\Http\SessionPrintQuoteStore:
        arguments:
            $timeToLive: '%yoowii.print_quote.ttl%'

    App\Yoowii\Pricing\Application\Quote\PrintQuoteStore:
        alias: App\Yoowii\Pricing\Infrastructure\Http\SessionPrintQuoteStore

    App\Yoowii\Sourcing\Domain\Repository\SupplierRouteRepository:
        alias: App\Yoowii\Sourcing\Infrastructure\Doctrine\Repository\DoctrineSupplierRouteRepository

    App\Yoowii\Sourcing\Domain\Repository\SupplierPricingMatrixVersionRepository:
        alias: App\Yoowii\Sourcing\Infrastructure\Doctrine\Repository\DoctrineSupplierPricingMatrixVersionRepository
