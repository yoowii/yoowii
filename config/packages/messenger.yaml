framework:
    messenger:
        transports:
            # Yoowii application messages only. Sylius retains its own
            # transports and failure policies.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                failure_transport: yoowii_failed
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
            # Doctrine queue is separated from legacy default and from
            # Sylius-specific failed transports. Do not globally set
            # framework.messenger.failure_transport.
            yoowii_failed: 'doctrine://default?queue_name=yoowii_failed'
            sync: 'sync://'

        routing:
            'App\Yoowii\PrintProduction\Application\Message\PreflightPrintAsset': async
            'App\Yoowii\Sourcing\Application\Message\SynchronizeRealisaprintCatalogConfigurations': async

# Tests do not consume messages or call supplier APIs.
