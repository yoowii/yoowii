name: Build Yoowii preprod images

on:
  push:
    branches: [chore/ci-cd]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-preprod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish PHP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/preprod/php.Dockerfile
          push: true
          tags: ghcr.io/yoowii/yoowii-php:sha-${{ github.sha }}
      - name: Build and publish Nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/preprod/nginx.Dockerfile
          push: true
          build-args: |
            YOOWII_PHP_IMAGE=ghcr.io/yoowii/yoowii-php:sha-${{ github.sha }}
          tags: ghcr.io/yoowii/yoowii-nginx:sha-${{ github.sha }}
