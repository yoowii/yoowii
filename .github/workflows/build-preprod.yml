name: Build Yoowii preprod images

on:
  push:
    branches: [preprod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-preprod-${{ github.ref }}
  # Avoid cancelling image publication after it has started.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The exact PHP image shipped to preprod must pass its prod bootstrap
      # BEFORE anything is pushed to GHCR or dispatched to infra-deploy.
      - name: Build PHP image locally (not published)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/preprod/php.Dockerfile
          load: true
          push: false
          tags: ghcr.io/yoowii/yoowii-php:sha-${{ github.sha }}

      - name: Smoke test Symfony prod bootstrap (isolated)
        shell: bash
        env:
          PHP_IMAGE: ghcr.io/yoowii/yoowii-php:sha-${{ github.sha }}
        run: |
          set -Eeuo pipefail
          network="yoowii-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          redis="yoowii-smoke-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$redis" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal "$network"
          docker run -d --name "$redis" --network "$network" \
            --network-alias ci-redis --read-only \
            --tmpfs /data:rw,nosuid,nodev \
            redis:7.4-alpine redis-server --save "" --appendonly no
          for attempt in $(seq 1 20); do
            if docker exec "$redis" redis-cli ping | grep -qx PONG; then
              break
            fi
            if (( attempt == 20 )); then
              echo "::error::Disposable Redis failed to start"
              exit 1
            fi
            sleep 1
          done

          # CI-only placeholders: no prod secrets, live MySQL or external network.
          # Cache/log files are ephemeral, and the final runtime image is tested.
          docker run --rm --network "$network" --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            --tmpfs /srv/sylius/var/cache:rw,uid=82,gid=82 \
            --tmpfs /srv/sylius/var/log:rw,uid=82,gid=82 \
            -e APP_ENV=prod -e APP_DEBUG=0 \
            -e APP_SECRET=ci-only-bootstrap-placeholder \
            -e 'DATABASE_URL=mysql://ci:ci@127.0.0.1:3306/ci_smoke?serverVersion=8.4.0&charset=utf8mb4' \
            -e YOOWII_REDIS_DSN=redis://ci-redis:6379 \
            --entrypoint sh "$PHP_IMAGE" -ec '
              cd /srv/sylius
              if ! php bin/console about --no-interaction --no-ansi >/tmp/about.log 2>&1; then
                echo "Symfony prod bootstrap failed:"
                tail -n 80 /tmp/about.log
                exit 1
              fi
              if ! php bin/console cache:warmup --no-interaction --no-ansi >/tmp/warmup.log 2>&1; then
                echo "Symfony prod cache warmup failed:"
                tail -n 80 /tmp/warmup.log
                exit 1
              fi
              echo "PASS: Symfony prod bootstrap and cache warmup"
            '

      - name: Publish verified PHP image to GHCR
        run: docker push ghcr.io/yoowii/yoowii-php:sha-${{ github.sha }}

      - name: Build and publish Nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/preprod/nginx.Dockerfile
          push: true
          build-args: |
            YOOWII_PHP_IMAGE=ghcr.io/yoowii/yoowii-php:sha-${{ github.sha }}
          tags: ghcr.io/yoowii/yoowii-nginx:sha-${{ github.sha }}

      - name: Verify both published GHCR image manifests
        if: github.ref == 'refs/heads/preprod'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          for image in yoowii-php yoowii-nginx; do
            docker buildx imagetools inspect "ghcr.io/yoowii/${image}:sha-${RELEASE_SHA}" >/dev/null
            echo "Verified GHCR manifest: ${image}:sha-${RELEASE_SHA}"
          done
          {
            echo "## GHCR preprod release verified"
            echo ""
            echo "Both PHP and Nginx manifests exist for \`${RELEASE_SHA}\`."
            echo "Publishing images does **not** deploy to the VPS."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Propose verified release to infra-deploy
        if: github.ref == 'refs/heads/preprod'
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$INFRA_DISPATCH_TOKEN" ]]; then
            echo "::warning::INFRA_REPOSITORY_DISPATCH_TOKEN is not configured. GHCR build is verified, but no deployment proposal was sent."
            echo "Infra handoff: not configured (no VPS deployment)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The cross-repository token must have Contents:write on yoowii/infra-deploy only.
          payload="$(jq -nc --arg sha "$RELEASE_SHA" '{
            event_type: "yoowii_preprod_images_published",
            client_payload: {sha: $sha, source_repository: "yoowii/yoowii", source_ref: "refs/heads/preprod"}
          }')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/yoowii/infra-deploy/dispatches"
          echo "Infra deployment proposal requested for ${RELEASE_SHA} (human approval required)." >> "$GITHUB_STEP_SUMMARY"


# Intentionally no deploy job here: publication does not imply promotion.
# Promote a verified image SHA through the separate, manually dispatched
# Deploy Yoowii preprod workflow after explicit operational approval.
