name: Build Yoowii preprod images

on:
  push:
    branches: [chore/ci-cd]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-preprod-${{ github.ref }}
  # Never cancel a workflow while it may be deploying to the VPS.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish PHP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/preprod/php.Dockerfile
          push: true
          tags: ghcr.io/yoowii/yoowii-php:sha-${{ github.sha }}
      - name: Build and publish Nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/preprod/nginx.Dockerfile
          push: true
          build-args: |
            YOOWII_PHP_IMAGE=ghcr.io/yoowii/yoowii-php:sha-${{ github.sha }}
          tags: ghcr.io/yoowii/yoowii-nginx:sha-${{ github.sha }}

  deploy:
    name: Deploy to preprod VPS
    needs: build
    runs-on: ubuntu-24.04
    environment: preprod
    # Shared with deploy-preprod.yml, ensuring one deployment at a time.
    concurrency:
      group: deploy-yoowii-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy immutable images and matching Compose through restricted SSH
        env:
          SSH_KEY: ${{ secrets.PREPROD_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.PREPROD_SSH_HOST_KEY }}
          HOST: ${{ vars.PREPROD_HOST }}
          USER: ${{ vars.PREPROD_USER }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$HOST" && test -n "$USER" && test -n "$SSH_KEY" && test -n "$SSH_HOST_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s compose.preprod.yml
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$USER@$HOST" "sudo -n /usr/local/sbin/yoowii-deploy-preprod $IMAGE_SHA" < compose.preprod.yml
